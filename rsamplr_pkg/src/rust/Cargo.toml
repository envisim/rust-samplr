[package]
name = "rsamplr"
version = "0.3.1"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.85.1"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
num-traits = "0.2.19"
savvy = "0.9.4"
# envisim_estimate = {version="0.6.0"}
# envisim_samplr = {version="0.7.0"}
# envisim_utils = {version="0.6.0", default-features=false}
envisim_estimate = {version="*", path="../../../envisim_estimate"}
envisim_samplr = {version="*", path="../../../envisim_samplr"}
envisim_utils = {version="*", path="../../../envisim_utils", default-features=false}

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -2 }

# suspicious
blanket_clippy_restriction_lints = "allow"

# pedantic

# restriction
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
default_numeric_fallback = "allow"
else_if_without_else = "allow"
empty_structs_with_brackets = "allow"
exhaustive_structs = "allow"
expect_used = "allow"
float_arithmetic = "allow"
indexing_slicing = "allow"
implicit_return = "allow"
integer_division_remainder_used = "allow"
iter_over_hash_type = "allow"
min_ident_chars = "allow"
missing_trait_methods = "allow"
map_err_ignore = "allow"
module_name_repetitions = "allow"
mod_module_files = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
same_name_method = "allow"
semicolon_inside_block = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
unused_trait_names = "allow"
unwrap_in_result = "allow"
question_mark_used = "allow"

# nursery
equatable_if_let = "warn"
imprecise_flops = "warn"
needless_collect = "warn"

[profile.release]
# By default, on release build, savvy terminates the R session when a panic
# occurs. This is the right behavior in that a panic means such a fatal event
# where we can have no hope of recovery.
#
# cf. https://doc.rust-lang.org/book/ch09-03-to-panic-or-not-to-panic.html
#
# However, it's possible that the panic is thrown by some of the dependency
# crate and there's little you can do. In such cases, you can change the
# following line to `panic = "unwind"` to always catch a panic.
panic = "abort"
