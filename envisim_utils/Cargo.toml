[package]
name = "envisim_utils"
version = "0.4.0"
edition = "2024"
authors = ["Wilmer Prentius <wilmer.prentius@slu.se>"]
homepage = "https://envisim.se"
repository = "https://github.com/envisim/rust-samplr"
description = "Utility methods for design-based sampling methods and estimation"
keywords = ["sampling", "statistics"]
categories = ["mathematics", "science", "science::geo"]
license = "AGPL-3.0-only"
include = ["/src", "LICENSE", "README.md", "CHANGELOG.md"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints]
workspace = true

[dependencies]
num-traits = "0.2.19"
rand = {version="0.9.2", features = ["small_rng"], optional = true}
rustc-hash = "2.1.1"

[features]
default = ["rand"]
rand = ["dep:rand"]
test-utils = []
